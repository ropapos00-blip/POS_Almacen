<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="L">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#19191f" />
			<stop offset="100%" stop-color="#09090b" />
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="1.4" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>

	<rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" />
	<rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#27272a" stroke-width="1.5" />

	<text
		x="32"
		y="45"
		text-anchor="middle"
		fill="#fbbf24"
		font-size="42"
		font-weight="800"
		font-family="Dolce Vita, 'Space Grotesk', sans-serif"
		filter="url(#glow)"
	>
		L
	</text>
</svg>